# Dev/test infrastructure for photo-sorter.
#
# As of the PhotoPrism + MariaDB drop, only pgvector remains as a managed
# service here. The embeddings service (CLIP + faces) runs externally over
# Tailscale and is configured via EMBEDDING_URL in .env.dev.
#
# TODO: remove after backup verified — the on-disk volumes at
#   ./volumes/photoprism-test-originals
#   ./volumes/photoprism-test-storage
#   ./volumes/mariadb-test-data
# are intentionally NOT deleted by this change. They hold the last known good
# PhotoPrism dataset before migration; keep them until the operator confirms
# the migrated native data passes `photo-sorter migrate-verify` and the
# backups are restorable. `docker compose down` won't touch them (they were
# bind mounts, never managed by compose).
services:
  pgvector-test:
    container_name: pgvector
    image: pgvector/pgvector:pg17
    ports:
      - "5433:5432"
    volumes:
      - ./volumes/pgvector_data:/var/lib/postgresql/data
    environment:
      PGDATA: "/var/lib/postgresql/data/pgdata"
      POSTGRES_PASSWORD: "photoprism"
