name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # for goreleaser to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'   # match go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # match Dockerfile

      - name: Install font-staging dependencies
        run: sudo apt-get update && sudo apt-get install -y curl unzip fontconfig

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
